<!doctype html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PGN Biometana Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
:root,[data-theme="dark"]{
  --bg:#12090B; --bg2:#180C0F; --panel:#1E1013; --panel2:#271519; --panel3:#331C21;
  --line:#3A2227; --line2:#4E2D34; --text:#F7ECEC; --muted:#BC9EA2; --dim:#856469;
  --acc:#E5484D; --acc2:#FF7A7E; --accbg:rgba(229,72,77,.14); --amber:#F5A524; --amberbg:rgba(245,165,36,.13);
  --green:#2FBF71; --greenbg:rgba(47,191,113,.13); --blue:#5AA2FF; --bluebg:rgba(90,162,255,.13); --violet:#A98BFF;
  --land:#3A2024; --landline:#5A333A; --sea:#0D0607; --shadow:0 10px 30px rgba(0,0,0,.45);
  --glass:rgba(30,16,19,.84);
  --side1:#7A1A1D; --side2:#3D0B0E; --hdr:#160A0D;
}
[data-theme="light"]{
  --bg:#FBF3F1; --bg2:#F5E6E3; --panel:#FFFFFF; --panel2:#FDF6F4; --panel3:#F6E6E3;
  --line:#EFD9D5; --line2:#E3C3BE; --text:#2A1214; --muted:#7D5C60; --dim:#A88A8D;
  --acc:#C83E43; --acc2:#A82D31; --accbg:rgba(200,62,67,.09); --amber:#C97A00; --amberbg:rgba(201,122,0,.10);
  --green:#1A9A57; --greenbg:rgba(26,154,87,.10); --blue:#2F6FD0; --bluebg:rgba(47,111,208,.09); --violet:#6A4FD8;
  --land:#F3DCD6; --landline:#E2BCB4; --sea:#FFFAF8; --shadow:0 10px 30px rgba(143,32,35,.10);
  --glass:rgba(255,255,255,.9);
  --side1:#8F2023; --side2:#5A1316; --hdr:#FFFFFF;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}::-webkit-scrollbar-track{background:transparent}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:248px 1fr;height:100vh;overflow:hidden}
.app.collapsed{grid-template-columns:76px 1fr}
aside{background:linear-gradient(180deg,var(--side1) 0%,var(--side2) 100%);color:#fff;border-right:0;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 14px;border-bottom:1px solid rgba(255,255,255,.12);min-height:72px}
.logo-slot{width:44px;height:44px;border-radius:12px;border:1.5px dashed rgba(255,255,255,.4);display:grid;place-items:center;cursor:pointer;flex:none;overflow:hidden;background:rgba(255,255,255,.08);position:relative;transition:.2s}
.logo-slot:hover{border-color:#fff}
.logo-slot img{width:100%;height:100%;object-fit:contain;background:#fff}
.logo-slot .ph{font-size:8.5px;font-weight:700;color:rgba(255,255,255,.75);text-align:center;line-height:1.1}
.brand-t{min-width:0}
.brand-t b{display:block;font-size:13.5px;letter-spacing:-.01em;white-space:nowrap}
.brand-t span{display:block;font-size:11px;color:rgba(255,255,255,.65);white-space:nowrap}
.collapsed .brand-t,.collapsed .nav a span,.collapsed .nav .sec,.collapsed .side-foot .t{display:none}
.nav{padding:12px 10px;flex:1;overflow:auto}
.nav .sec{font-size:10.5px;font-weight:700;letter-spacing:.09em;color:rgba(255,255,255,.45);padding:14px 10px 6px;text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:rgba(255,255,255,.74);text-decoration:none;font-weight:600;font-size:13.5px;cursor:pointer;position:relative;transition:background .15s,color .15s;white-space:nowrap}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a.on{background:rgba(255,255,255,.16);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.nav a.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:3px;background:#fff}
.nav a svg{width:19px;height:19px;flex:none}
.nav a .kbd{margin-left:auto;font-size:10px;font-family:var(--mono);color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.2);border-radius:5px;padding:1px 5px}
.nav a .pill{margin-left:auto;font-size:10px;background:#fff;color:#8F2023;border-radius:20px;padding:1px 7px;font-weight:700}
.side-foot{padding:12px;border-top:1px solid rgba(255,255,255,.12);display:flex;gap:10px;align-items:center}
.side-foot .av{width:34px;height:34px;border-radius:50%;background:#fff;color:#8F2023 !important;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;flex:none}
.side-foot .t b{display:block;font-size:12.5px}.side-foot .t span{font-size:11px;color:rgba(255,255,255,.65);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
header{height:64px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--hdr);flex:none;position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--acc),transparent 60%)}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;transition:.15s;position:relative;flex:none}
.icon-btn:hover{border-color:var(--line2);background:var(--panel2)}
.icon-btn svg{width:17px;height:17px}
.icon-btn .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 2px var(--panel)}
.crumb h1{margin:0;font-size:17px;letter-spacing:-.02em}
.crumb span{font-size:11.5px;color:var(--muted)}
.search{flex:1;max-width:360px;min-width:170px;margin-left:auto;position:relative}
.search input{width:100%;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);padding:0 12px 0 36px;outline:none}
.search input:focus{border-color:var(--acc)}
.search svg{position:absolute;left:11px;top:10px;width:16px;height:16px;color:var(--muted)}
.search .res{position:absolute;top:42px;left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:50;max-height:320px;overflow:auto;display:none}
.search .res div{padding:9px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;font-size:13px}
.search .res div:hover{background:var(--panel2)}
.search .res div small{color:var(--muted)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex:none}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:7px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--panel3);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.seg.red button.on{background:var(--acc);color:#fff}
.clock{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;text-align:right;line-height:1.25}
.clock b{color:var(--text);font-size:13px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--green);letter-spacing:.06em}
.live i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 var(--green);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,191,113,.6)}70%{box-shadow:0 0 0 8px rgba(47,191,113,0)}100%{box-shadow:0 0 0 0 rgba(47,191,113,0)}}

.content{flex:1;overflow:auto;padding:20px;position:relative}
.page{display:none;animation:fade .35s ease}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;position:relative}
.card h3{margin:0;font-size:14px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.card h3 small{font-weight:500;color:var(--muted);font-size:12px}
.card .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--panel3);color:var(--muted);white-space:nowrap}
.tag.g{background:var(--greenbg);color:var(--green)}.tag.r{background:var(--accbg);color:var(--acc)}.tag.a{background:var(--amberbg);color:var(--amber)}.tag.b{background:var(--bluebg);color:var(--blue)}
.btn{height:34px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:700;font-size:12.5px;display:inline-flex;align-items:center;gap:7px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--line2);background:var(--panel3)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.pri:hover{filter:brightness(1.08)}
.btn.grn{background:var(--green);border-color:var(--green);color:#fff}
.btn svg{width:15px;height:15px}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.up{color:var(--green)}.down{color:var(--acc)}

/* KPI tiles */
.kpis{grid-template-columns:repeat(6,minmax(0,1fr))}
.kpi{padding:14px 16px 30px;overflow:hidden}
.kpi .l{font-size:11.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .v{font-size:25px;font-weight:700;margin:6px 0 2px;letter-spacing:-.03em;white-space:nowrap}
.kpi .v small{font-size:12px;color:var(--muted);font-weight:500;margin-left:4px;letter-spacing:0}
.kpi .s{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi svg.spark{position:absolute;right:0;bottom:0;width:100%;height:26px;opacity:.9;pointer-events:none}
.kpi .ic{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--accbg);color:var(--acc)}
.kpi .ic svg{width:13px;height:13px}

/* map */
.mapwrap{position:relative;height:calc(100vh - 104px);min-height:560px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--sea)}
svg.map{width:100%;height:100%;display:block}
.mapwrap svg.map{cursor:grab}
.mapwrap svg.map:active{cursor:grabbing}
.land{fill:var(--land);stroke:var(--landline);stroke-width:.6;vector-effect:non-scaling-stroke}
.gridline{stroke:var(--line);stroke-width:.5;vector-effect:non-scaling-stroke;opacity:.5}
.pipe{fill:none;stroke:var(--acc);stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.pipe.flow{stroke:#fff;stroke-dasharray:2 10;animation:flow 1.2s linear infinite;opacity:.7}
[data-theme="light"] .pipe.flow{stroke:#fff}
@keyframes flow{to{stroke-dashoffset:-24}}
.route{fill:none;stroke:var(--amber);stroke-width:1.3;stroke-dasharray:4 4;vector-effect:non-scaling-stroke;opacity:.55}
.route.sel{opacity:1;stroke-width:2.6;stroke-dasharray:none}
.has-sel .route:not(.sel){opacity:.1}
.feeder{fill:none;stroke:var(--acc2);stroke-width:1.6;stroke-dasharray:1 3;vector-effect:non-scaling-stroke;stroke-linecap:round}
.mapov{position:absolute;z-index:5}
.glass{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.maptip{position:absolute;pointer-events:none;z-index:20;padding:10px 12px;font-size:12px;min-width:180px;display:none}
.maptip b{font-size:13px}
.maptip .r{display:flex;justify-content:space-between;gap:14px;margin-top:3px}
.maptip .r span{color:var(--muted)}
.lyr label{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 0;cursor:pointer;font-weight:500}
.lyr input{accent-color:var(--acc)}
.sw{width:18px;height:4px;border-radius:2px;display:inline-block;flex:none}
.side-panel{position:absolute;right:14px;top:14px;bottom:14px;width:340px;z-index:6;display:flex;flex-direction:column;overflow:hidden}
.side-panel .sp-b{overflow:auto;padding:14px 16px;flex:1}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 8px}
.tabs button{border:0;background:none;padding:12px 10px;font-weight:700;font-size:12.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--text);border-color:var(--acc)}
.trk{display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;cursor:pointer;border:1px solid transparent;transition:.15s}
.trk:hover{background:var(--panel2)}
.trk.on{border-color:var(--acc);background:var(--accbg)}
.trk .b{flex:1;min-width:0}
.trk .b b{font-size:12.5px}
.trk .b div{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:6px;border-radius:6px;background:var(--panel3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--acc);transition:width .4s}
.stepper{position:relative;margin:6px 0 0 4px}
.stepper .st{display:flex;gap:12px;position:relative;padding-bottom:14px}
.stepper .st::before{content:"";position:absolute;left:7px;top:16px;bottom:0;width:2px;background:var(--line)}
.stepper .st:last-child::before{display:none}
.stepper .st.done::before{background:var(--green)}
.stepper .st i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line2);background:var(--panel);flex:none;margin-top:1px;z-index:1}
.stepper .st.done i{background:var(--green);border-color:var(--green)}
.stepper .st.cur i{border-color:var(--acc);background:var(--acc);box-shadow:0 0 0 4px var(--accbg)}
.stepper .st b{font-size:12.5px;display:block}.stepper .st span{font-size:11.5px;color:var(--muted)}
.statg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.statg div{background:var(--panel2);border-radius:10px;padding:9px 10px}
.statg span{font-size:10.5px;color:var(--muted);display:block;font-weight:600}
.statg b{font-size:15px}
.yearbar{left:14px;bottom:14px;padding:12px 16px;display:flex;align-items:center;gap:16px}
.yearbar input[type=range]{width:240px;accent-color:var(--acc)}
.ticks{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);font-family:var(--mono);width:240px;margin-top:2px}

/* tables */
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{text-align:left;font-size:11px;color:var(--muted);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--panel)}
table.t th:hover{color:var(--text)}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t tr:hover td{background:var(--panel2)}
table.t tr.clk{cursor:pointer}
.r{text-align:right}

/* order book */
.ob{font-family:var(--mono);font-size:12px}
.ob .row{display:grid;grid-template-columns:.8fr 1fr 1.2fr;gap:10px;padding:3px 8px;position:relative}
.ob .row span{position:relative;z-index:1}
.ob .row span{text-align:right}.ob .row span:first-of-type{text-align:left}
.ob .row i{position:absolute;right:0;top:1px;bottom:1px;border-radius:3px}
.ob .ask i{background:var(--accbg)}.ob .bid i{background:var(--greenbg)}
.ob .ask span:first-child{color:var(--acc)}.ob .bid span:first-child{color:var(--green)}
.ob .mid{padding:8px;font-size:16px;font-weight:700;display:flex;justify-content:space-between;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:4px 0}
.flash-up{animation:fu .6s}.flash-dn{animation:fd .6s}
@keyframes fu{from{background:var(--greenbg)}}@keyframes fd{from{background:var(--accbg)}}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.field label{font-size:11.5px;color:var(--muted);font-weight:600}
.field input,.field select{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);padding:0 12px;outline:none;font-family:var(--mono)}
.field input:focus{border-color:var(--acc)}
input[type=range]{accent-color:var(--acc)}

.toast-wrap{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:100}
.toast{padding:12px 14px;min-width:280px;max-width:360px;display:flex;gap:10px;align-items:flex-start;animation:tin .3s ease;font-size:12.5px}
.toast b{display:block;font-size:13px}
.toast .ti{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none}
@keyframes tin{from{opacity:0;transform:translateX(20px)}}
.feed{display:flex;flex-direction:column;gap:2px;max-height:100%;overflow:auto}
.feed .it{display:flex;gap:10px;padding:8px 6px;border-radius:8px;font-size:12.5px}
.feed .it.new{animation:fade .5s}
.feed .it:hover{background:var(--panel2)}
.feed .it .ti{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none}
.feed .it .ti svg{width:14px;height:14px}
.feed .it small{display:block;color:var(--muted);font-size:11px;margin-top:1px}

.pres-bar{position:fixed;top:0;left:0;height:3px;background:var(--acc);z-index:200;width:0}
.pres-badge{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:200;padding:7px 14px;font-size:12px;font-weight:700;display:none;align-items:center;gap:8px}
.disclaimer{font-size:11px;color:var(--dim);text-align:center;padding:14px 0 2px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:420px;background:var(--panel);border-left:1px solid var(--line);z-index:120;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow);display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start}
.drawer .db{padding:18px 20px;overflow:auto;flex:1}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:110;display:none}
.scrim.on{display:block}
.gauge text{font-family:var(--mono)}
.kan{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kan .col{background:var(--panel2);border-radius:12px;padding:10px;min-height:150px}
.kan .col h4{margin:0 0 8px;font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between}
.kan .kc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:8px;font-size:12px;cursor:grab}
.kan .kc b{font-size:12.5px;display:block}
.kan .kc.drag{opacity:.4}
.kan .col.over{outline:2px dashed var(--acc);outline-offset:-4px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:20px;border:1px solid var(--line);font-size:12px;font-weight:600;cursor:pointer;background:var(--panel2)}
.chip.on{border-color:var(--acc);color:var(--acc);background:var(--accbg)}
.legend-i{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-right:12px}
.legend-i i{width:10px;height:10px;border-radius:3px;display:inline-block}
.axis text{fill:var(--muted);font-size:10.5px;font-family:var(--mono)}
.axis line,.axis path{stroke:var(--line)}
.gridy line{stroke:var(--line);stroke-dasharray:2 4}
.gridy path{display:none}
.ttip{position:fixed;pointer-events:none;z-index:300;padding:8px 10px;font-size:12px;display:none}
.flowsvg text{font-size:11.5px;fill:var(--text);font-weight:600}
.flowsvg .lnk{fill:none;stroke-opacity:.35;transition:stroke-opacity .2s}
.flowsvg .lnk:hover{stroke-opacity:.7}
.proc{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:4px 2px 8px}
.proc .pn{flex:1;min-width:120px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;position:relative;transition:.3s}
.proc .pn b{font-size:12.5px;display:block}.proc .pn span{font-size:11px;color:var(--muted)}
.proc .pn .vv{font-family:var(--mono);font-size:14px;font-weight:600;margin-top:6px}
.proc .pn.bad{border-color:var(--acc);background:var(--accbg)}
.proc .pn.hold{border-color:var(--amber);background:var(--amberbg)}
.proc .arr{width:26px;flex:none;display:grid;place-items:center;color:var(--dim)}
.proc .arr svg{width:18px}
.proc .arr.anim svg{color:var(--green);animation:nudge 1s infinite}
@keyframes nudge{50%{transform:translateX(3px)}}
.alarm{display:none;padding:12px 14px;border-radius:12px;background:var(--accbg);border:1px solid var(--acc);color:var(--text);margin-bottom:16px;align-items:center;gap:12px;animation:blink 1s infinite}
@keyframes blink{50%{border-color:transparent}}

.content{background:radial-gradient(1200px 500px at 100% 0%,var(--accbg),transparent 60%)}
.card{box-shadow:0 1px 0 rgba(255,255,255,.02)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc);opacity:.75}
.role-badge{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:20px;background:var(--accbg);color:var(--acc);font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap;border:1px solid transparent}
.role-badge:hover{border-color:var(--acc)}
.hero-card{background:linear-gradient(120deg,var(--accbg),transparent 70%),var(--panel);border-color:var(--line2)}
.hero-ic{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#C83E43,#8F2023);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 8px 20px rgba(200,62,67,.35)}
[data-role]:not([data-role="operator"]) .op-only{display:none !important}
[data-role="vvb"] .trade-ok,[data-role="pks"] .trade-ok{display:none !important}
[data-role="buyer"] #cxSide button[data-v="jual"]{display:none}
[data-role="vvb"] .cx-row{grid-template-columns:1fr 1fr !important}
/* login */
.login{position:fixed;inset:0;z-index:500;display:none;grid-template-columns:1.15fr 1fr;background:var(--bg)}
.lg-left{position:relative;overflow:hidden;background:radial-gradient(900px 600px at 20% 10%,#C83E43 0%,#8F2023 40%,#3D0B0E 100%);color:#fff;padding:40px 48px;display:flex;flex-direction:column}
.lg-map{position:absolute;top:0;right:-18%;width:100%;height:100%;opacity:.55;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 45%);mask-image:linear-gradient(90deg,transparent 0%,#000 45%)}
.lg-map path:first-child{fill:rgba(255,255,255,.07);stroke:rgba(255,255,255,.18);stroke-width:1.2}
.lg-hub{fill:#fff}.lg-ring{fill:none;stroke:rgba(255,255,255,.5);stroke-width:2}
.lg-pipe{fill:none;stroke:#FFD2D3;stroke-width:5;stroke-dasharray:6 10;animation:flow 1.4s linear infinite;stroke-linecap:round}
.lg-brand{position:relative;display:flex;gap:12px;align-items:center}
.lg-brand b{display:block;font-size:16px}.lg-brand span{font-size:12px;opacity:.75}
.lg-logo{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.12);border:1.5px dashed rgba(255,255,255,.45);display:grid;place-items:center;overflow:hidden;font-size:10px;font-weight:800;letter-spacing:.06em}
.lg-logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.lg-hero{position:relative;margin-top:auto;max-width:520px}
.lg-kick{font-size:12px;font-weight:800;letter-spacing:.2em;opacity:.75;margin-bottom:10px}
.lg-hero h1{font-size:38px;line-height:1.12;margin:0 0 14px;letter-spacing:-.03em}
.lg-hero p{font-size:15px;opacity:.85;line-height:1.55;margin:0 0 26px}
.lg-stats{display:flex;gap:28px}
.lg-stats b{display:block;font-size:26px;font-family:var(--mono);letter-spacing:-.03em}.lg-stats span{font-size:12px;opacity:.75}
.lg-foot{position:relative;margin-top:36px;font-size:11.5px;opacity:.6}
.lg-right{display:grid;place-items:center;padding:32px;overflow:auto;background:var(--bg)}
.lg-box{width:100%;max-width:440px}
.lg-box h2{font-size:28px;margin:0 0 6px;letter-spacing:-.02em}
.lg-roles{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.lg-role{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--panel);cursor:pointer;transition:.15s}
.lg-role:hover{border-color:var(--line2)}
.lg-role.on{border-color:var(--acc);background:var(--accbg)}
.lg-role b{display:block;font-size:13.5px}.lg-role span{display:block;font-size:11.5px;color:var(--muted);line-height:1.35}
.lg-ic{width:38px;height:38px;border-radius:11px;background:var(--panel3);color:var(--acc);display:grid;place-items:center;flex:none}
.lg-role.on .lg-ic{background:var(--acc);color:#fff}
.lg-radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--line2);flex:none}
.lg-role.on .lg-radio{border:5px solid var(--acc)}
@media (max-width:900px){.login{grid-template-columns:1fr}.lg-left{display:none}}
@media (max-width:1300px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){.app{grid-template-columns:1fr}aside{display:none}.side-panel{width:auto;left:14px;top:auto;height:50%}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}header .seg,.clock{display:none}}
</style>

      <button class="icon-btn" id="collapse" title="Ciutkan menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="crumb"><h1 id="pgTitle">Command Center</h1><span id="pgSub"></span></div>

      <button class="icon-btn" id="notifBtn" title="Notifikasi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></svg><span class="dot"></span></button>
      <button class="icon-btn" id="themeBtn" title="Ganti tema"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg></button>
    </header>
    <div class="content" id="content">
      <!--PAGES-->
    </div>
  </main>
</div>

}

function gauge(el, { v, min, max, good, label, unit, dec = 1, invert }) {
  // good: [a,b] range zone
  const W = 170, H = 142, r = 64, cx = W / 2, cy = 74, a0 = -Math.PI * 0.75, a1 = Math.PI * 0.75;

    <path d="${arc({ startAngle: sc(good[0]), endAngle: sc(good[1]) })}" transform="translate(${cx},${cy})" fill="${css("--green")}" opacity=".22"/>

    <text x="${cx}" y="${cy - 6}" text-anchor="middle" font-size="22" font-weight="700" fill="${css("--text")}">${fmt(v, dec)}</text>
    <text x="${cx}" y="${cy + 12}" text-anchor="middle" font-size="10" fill="${css("--muted")}">${unit}</text>
    <text x="${cx - 45}" y="${cy + 60}" text-anchor="middle" font-size="9.5" fill="${css("--dim")}">${min}</text><text x="${cx + 45}" y="${cy + 60}" text-anchor="middle" font-size="9.5" fill="${css("--dim")}">${max}</text>
  </svg><div style="text-align:center;font-size:12.5px;font-weight:700;margin-top:2px">${label}</div><div style="text-align:center;margin-top:4px"><span class="tag ${ok ? "g" : "r"}">${ok ? "Sesuai spesifikasi" : "DI LUAR SPEC"}</span></div>`;
}

      n.append("path").attr("d", "M-3 3V-1l3-2 3 2v4").style("stroke", "#fff").style("fill", "none").attr("stroke-width", 1.3);

      if (!visPKS(p)) { const n = gm.append("g").attr("data-x", xy[0]).attr("data-y", xy[1]).attr("opacity", 0.3); n.append("circle").attr("r", 2.4).style("fill", "var(--muted)"); M.nodes.push(n); return; }
      const mine = S.role === "pks";
      const n = gm.append("g").attr("data-x", xy[0]).attr("data-y", xy[1]).style("cursor", "pointer").attr("opacity", act ? 1 : 0.35);
      if (act) n.append("circle").attr("r", mine ? 16 : 3 + pr * 9).style("fill", "var(--green)").attr("opacity", mine ? 0.25 : 0.16);

        if (!opt.mini && !mine) n.append("text").attr("class", "plab").attr("x", 6).attr("y", 3).attr("font-size", 9).style("fill", "var(--muted)").attr("font-family", "var(--mono)").text(p.id).style("display", "none");
      }

      if (act) n.append("circle").attr("r", 16).style("fill", "var(--acc)").attr("opacity", 0.15).append("animate").attr("attributeName", "r").attr("values", "11;20;11").attr("dur", "2.4s").attr("repeatCount", "indefinite");
      n.append("rect").attr("x", -9).attr("y", -9).attr("width", 18).attr("height", 18).attr("rx", 5).attr("transform", "rotate(45)").style("fill", act ? "var(--acc)" : "var(--panel3)").style("stroke", "var(--panel)").attr("stroke-width", 2);
      n.append("path").attr("d", "M-3.5 3.5V-1l3.5-2.6L3.5-1v4.5").style("stroke", "#fff").style("fill", "none").attr("stroke-width", 1.4);
      n.append("text").attr("x", 15).attr("y", 4).attr("font-size", opt.mini ? 10 : 11.5).attr("font-weight", 700).style("fill", "var(--text)").attr("paint-order", "stroke").style("stroke", "var(--sea)").attr("stroke-width", 3).text(h.name.replace("Hub ", "") + (act ? "" : ` (Th${h.year})`));
      if (!opt.mini) n.on("mousemove", (e) => showTip(`<b>${h.name}</b><div class="r"><span>Status</span>${act ? "Beroperasi" : "Dibangun Th" + h.year}</div><div class="r"><span>Pasokan</span><b class="num">${fmt(hubSupply(h.id), 1)} MMSCFD</b></div><div class="r"><span>Injeksi</span>${h.inj}</div>`, e)).on("mouseleave", hideTip).on("click", (e) => { e.stopPropagation(); M.onSelect && M.onSelect({ type: "hub", o: h }); });
      M.nodes.push(n);
    });
    // truck glyphs
    TRUCKS.forEach(t => { t["el" + (opt.mini ? "m" : "")] = null; t.routeEl = opt.mini ? t.routeEl : null; });
    TRUCKS.filter(visTruck).forEach(t => {
      const n = gt.append("g").style("cursor", "pointer");
      n.append("circle").attr("class", "selring").attr("r", 13).style("fill", "none").style("stroke", "var(--acc)").attr("stroke-width", 2).style("display", "none").append("animate").attr("attributeName", "r").attr("values", "9;16;9").attr("dur", "1.4s").attr("repeatCount", "indefinite");
      const b = n.append("g").attr("class", "body");
      b.append("circle").attr("r", opt.mini ? 3.4 : 6.5).style("stroke", "var(--panel)").attr("stroke-width", 1.5);
      if (!opt.mini) b.append("path").attr("d", "M-2.2 -2.6 L2.8 0 L-2.2 2.6 Z").style("fill", "#fff");
      if (!opt.mini) n.on("click", (e) => { e.stopPropagation(); M.onSelect && M.onSelect({ type: "truck", o: t }); }).on("mousemove", (e) => { const i = truckInfo(t); showTip(`<b>${t.id}</b><div class="r"><span>Status</span>${i.status}</div><div class="r"><span>Muatan</span><b class="num">${fmt(t.cargo)} MSCF</b></div><div class="r"><span>ETA</span>${t.state === "jalan" ? i.eta + " mnt" : "–"}</div>`, e); }).on("mouseleave", hideTip);
      t["el" + (opt.mini ? "m" : "")] = n.node();
    });

  };
  M.scale = () => {
    const k = M.k;
    M.nodes.forEach(n => n.attr("transform", `translate(${n.attr("data-x")},${n.attr("data-y")}) scale(${1 / k})`));
    glab.selectAll("*").remove();
    g.selectAll(".plab").style("display", k > 3.2 ? null : "none");
  };
  M.frame = () => {
    TRUCKS.forEach(t => {
      const el = t["el" + (opt.mini ? "m" : "")]; if (!el) return;
      const [x, y, a] = truckPos(t);
      el.setAttribute("transform", `translate(${x},${y}) scale(${1 / M.k})`);
      const b = el.querySelector(".body"); b.setAttribute("transform", `rotate(${(a * 180) / Math.PI})`);
      b.querySelector("circle").setAttribute("fill", css(STC[t.state]));
    });
    if (M.follow && M.sel && M.sel.type === "truck") { const [x, y] = truckPos(M.sel.o); M.center(x, y, null, true); }
  };
  if (!opt.mini) {
    M.zoom = d3.zoom().scaleExtent([0.8, 14]).on("zoom", (e) => { g.attr("transform", e.transform); const k = e.transform.k; if (Math.abs(k - M.k) > 0.001) { M.k = k; M.scale(); } });
    svg.call(M.zoom).on("dblclick.zoom", null);
    svg.on("click", () => M.onSelect && M.onSelect(null));
  }
  M.fit = (b = [99.6, 108.6, -7.0, 2.6], rightPad = 0, inst, pad = { l: 0, t: 0, b: 0 }) => {
    const W = el.clientWidth - rightPad - pad.l, H = el.clientHeight - pad.t - pad.b, A = PJ(b[0], b[3]), B = PJ(b[1], b[2]);
    if (W <= 10 || H <= 10) return;
    const k = Math.min(W / (B[0] - A[0]), H / (B[1] - A[1])) * 0.94;
    const tx = pad.l + (W - (B[0] - A[0]) * k) / 2 - A[0] * k, ty = pad.t + (H - (B[1] - A[1]) * k) / 2 - A[1] * k;
    const tr = d3.zoomIdentity.translate(tx, ty).scale(k);
    if (M.zoom) (inst ? svg : svg.transition().duration(700)).call(M.zoom.transform, tr); else { g.attr("transform", tr); M.k = k; M.scale(); }
  };
  M.center = (x, y, k, inst) => {
    const W = el.clientWidth - (opt.pad || 0), H = el.clientHeight; k = k || d3.zoomTransform(svg.node()).k;
    const tr = d3.zoomIdentity.translate(W / 2 - x * k, H / 2 - y * k).scale(k);
    (inst ? svg : svg.transition().duration(650)).call(M.zoom.transform, tr);
  };
  return M;
}

function mtScore(h, b) {

  const vol = clamp(1 - Math.abs(hubSupply(h.id) * 0.6 - b.v) / 12, 0.1, 1);
  const andal = { PDW: 0.94, GSK: 0.88, DRI: 0.84 }[h.id];

  seed.forEach(s => pushFeed(...s));
  let pg = "overview"; try { pg = localStorage.getItem("pgn_page") || pg; } catch (e) {}
  go(can(pg) ? pg : NAVP()[0].id);
  if (!ROLE) showLogin();
  let last = performance.now(), acc = 0;
  const loop = (now) => {
    const dt = Math.min(0.1, (now - last) / 1000); last = now; acc += dt;
    stepFleet(dt);
    if (S.page === "tracking" && MAP.tick) MAP.tick();
    if (S.page === "overview" && MINI) MINI.frame();
    if (acc >= 1) {
      acc = 0; if (MAP.slow) MAP.slow(); if (S.page === "overview") ovKpis(); if (S.page === "mitra") mtrPick();
      if (inited.carbon) cxTick(); if (inited.quality) qTick();
      if (rnd() < 0.25) { const p = S.role === "pks" ? MY_PKS : pick(activePKS()); pushFeed(`Sensor IoT <b>${p.id}</b>: produksi ${fmt(prodOf(p), 2)} MMSCFD, H₂S ${fmt(p.h2s, 1)} ppm`, "Supply Tracking", "b", "spark"); }
    }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
  window.addEventListener("resize", () => { if (S.page === "overview") renderOv(); else PAGE_SHOW[S.page] && PAGE_SHOW[S.page](); });
})();
